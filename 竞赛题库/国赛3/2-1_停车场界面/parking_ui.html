<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>停车场管理</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Microsoft YaHei";background:#f0f2f5}
.hdr{background:#1890ff;color:#fff;padding:16px 24px}.hdr h1{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:20px}
.sp{width:100%;aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.free{background:#52c41a}.used{background:#ff4d4f}
.stats{display:flex;gap:16px;padding:0 20px}.stat{flex:1;background:#fff;padding:16px;border-radius:8px;text-align:center}
.stat .n{font-size:28px;font-weight:bold;color:#1890ff}.stat .l{font-size:13px;color:#999}
</style></head><body>
<div class="hdr"><h1>🅿️ 智能停车场管理</h1></div>
<div class="stats">
<div class="stat"><div class="n">200</div><div class="l">总车位</div></div>
<div class="stat"><div class="n">142</div><div class="l">已占用</div></div>
<div class="stat"><div class="n">58</div><div class="l">空闲</div></div>
<div class="stat"><div class="n">¥3,280</div><div class="l">今日收入</div></div>
</div>
<div class="grid">
<div class="sp used">A-01</div><div class="sp used">A-02</div><div class="sp free">A-03</div><div class="sp free">A-04</div>
<div class="sp used">A-05</div><div class="sp free">A-06</div><div class="sp used">A-07</div><div class="sp free">A-08</div>
<div class="sp free">A-09</div><div class="sp used">A-10</div><div class="sp free">A-11</div><div class="sp used">A-12</div>
<div class="sp used">A-13</div><div class="sp free">A-14</div><div class="sp used">A-15</div><div class="sp free">A-16</div>
</div></body></html>
